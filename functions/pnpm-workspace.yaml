# Build-script approvals for the Cloud Functions buildpack (pnpm 11), which no longer
# reads the "pnpm" field in package.json; that field stays for pnpm 10 (CI deploy job).
allowBuilds:
  protobufjs: true
  re2: true

# Keep this override in sync with package.json for pnpm 10 --ignore-workspace.
# pnpm 11 Cloud Functions builds read their overrides from this file.
overrides:
  'protobufjs@>=7.0.0 <7.6.6': 7.6.6
