name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Previous release tag to redeploy (missing attachment rebuilds that tag)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
# Same lock as promotion; never interrupt a Firebase deploy.
concurrency:
  group: web-sequence-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Resolve an existing release before rollback
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v4
        with:
          ref: master
          path: .release-policy
      - uses: ./.release-policy/.github/actions/deploy-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        with:
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
