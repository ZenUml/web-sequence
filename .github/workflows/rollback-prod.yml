name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Previously gated release tag (release-<run-id>-<attempt>)'
        required: true
        type: string
permissions:
  contents: read
  actions: read
# Same lock as promotion; never interrupt a Firebase deploy.
concurrency:
  group: web-sequence-production
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ./.github/actions/deploy-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.ref }}
        with:
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
