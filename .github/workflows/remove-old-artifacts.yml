name: Remove old artifacts

on:
  schedule:
    # Every day at 1am
    - cron: '0 1 * * *'

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # For private repos
    permissions:
      actions: write

    steps:
      - name: Remove old non-release artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100,
            });
            for (const artifact of artifacts) {
              // Native artifact retention owns release expiry (90 days).
              if (artifact.name.startsWith('release-bundle-')) continue;
              if (Date.parse(artifact.created_at) >= cutoff) continue;
              await github.rest.actions.deleteArtifact({ ...context.repo, artifact_id: artifact.id });
            }
