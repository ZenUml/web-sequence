# Build + deploy staging, gate on a deployed-URL E2E run, then auto-draft a
# production release. See docs/adr/0001-release-pipeline-imitating-conf-app.md.

name: Deploy to Stage

permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  # Cancel superseded runs per ref, but NEVER cancel master — an in-flight run
  # may be creating a draft release we must not lose.
  group: deploy-staging-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build and local E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm install --frozen-lockfile && pnpm build
      # Cutover (M05): build the React rewrite artifact that firebase.json now
      # serves (hosting.public: "web/dist"). web/ has its own lockfile, so it
      # needs its own install. The legacy `pnpm build` above still produces the
      # extension's dist/app/ assembly (retained for rollback).
      - name: Build web/dist (cutover hosting artifact)
        # --ignore-workspace forces pnpm to create a local web/node_modules instead of
        # hoisting into the root (pnpm-workspace.yaml exists at repo root). Without it,
        # Vite places .vite-temp in root node_modules where @vitejs/plugin-react is absent.
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-workspace && pnpm build
      # Pre-deploy guard: serve the built dist statically and verify the diagram
      # renders. Catches deploy-only bundling bugs (e.g. a dev-only /@fs/ asset
      # path) that the dev-server suite can't see, BEFORE anything ships to
      # staging. Runs on PRs too. See e2e/tests/production-build.spec.js.
      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify production build and application E2E
        env:
          PW_PROD_BUILD: '1'
        run: pnpm exec playwright test --project=chromium
      - name: Package Chrome extension
        # gulp release is incompatible with Node 20+; replicate its steps directly.
        run: bash scripts/release/package-extension.sh
      - name: Create deployment bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/release/bundle.mjs
      - name: Upload deployment bundle
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: release-bundle/
          retention-days: 3
          if-no-files-found: error
      - name: Setup Firebase service account
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp-key.json"
      - name: Restore the exact bundle for staging
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir deployment
          tar -xzf release-bundle/deploy.tar.gz -C deployment
      # Like conf-app Lite, feature branches and same-repository PRs deploy staging.
      # Live marker checks prevent a concurrently replaced site passing the gate.
      - name: Deploy functions config (staging)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          cd deployment/functions && pnpm install --frozen-lockfile --ignore-workspace && pnpm deploy:config:staging
      - name: Deploy to staging
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp-key.json"
          cd deployment
          node functions/node_modules/firebase-tools/lib/bin/firebase.js deploy --project staging-zenuml-27954 --config firebase.json --non-interactive
      - name: Upload extension dir # Browsable under actions/jobs
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension
      - name: Upload extension.zip # Consumed by the draft-release job
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip

  # Hard gate: run the full Playwright suite against the *deployed* staging site.
  # A red gate blocks the draft release, so a production release can only ever be
  # created from a build already proven green on staging.
  staging-gate:
    name: E2E gate (staging)
    needs: build
    if: github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: release-bundle
      - name: Verify staging commit before E2E
        run: node scripts/release/check-live.mjs https://staging.zenuml.com release-bundle/manifest.json
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps
      # Chromium is the configured release-gating browser for web-sequence.
      - name: Run full E2E suite against staging
        env:
          PW_BASE_URL: https://staging.zenuml.com
        run: pnpm exec playwright test --project=chromium
      - name: Verify staging commit after E2E
        run: node scripts/release/check-live.mjs https://staging.zenuml.com release-bundle/manifest.json

  validation:
    # A deduplicated push may be cancelled by the PR run. It must not leave
    # a failed check with the same name as the required PR merge gate.
    name: ${{ github.event_name == 'pull_request' && 'Release validation' || 'Branch validation' }}
    needs: [build, staging-gate]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require build and applicable staging E2E
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          GATE_RESULT: ${{ needs.staging-gate.result }}
          EXPECT_GATE: ${{ github.ref == 'refs/heads/master' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$EXPECT_GATE" = true ]; then
            test "$GATE_RESULT" = success
          fi

  # Once the gate is green, auto-create a DRAFT production release. The only
  # remaining human action is clicking "Publish" on the draft, which fires
  # deploy-prod.yml (on: release: released/prereleased).
  draft-release:
    name: Create draft release
    needs: staging-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download extension.zip
        uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - name: Download production bundle for the release attachment
        uses: actions/download-artifact@v4
        with:
          name: release-bundle-${{ github.run_attempt }}
          path: release-bundle
      - name: Compute release tag
        id: tag
        run: echo "tag=release-$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GH_ACTION_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" extension.zip release-bundle/deploy.tar.gz \
            --draft \
            --target "${{ github.sha }}" \
            --title "$tag" \
            --notes "Auto-drafted after the staging E2E gate passed on commit ${{ github.sha }}. Review, then click **Publish** to deploy to production (app.zenuml.com)."
