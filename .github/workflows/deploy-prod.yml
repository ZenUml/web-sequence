name: Deploy to Prod
on:
  release:
    types: [published]
permissions:
  contents: read
  actions: read
concurrency:
  group: web-sequence-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Read deployment policy from protected master, never an arbitrary tag.
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: ./.github/actions/deploy-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        with:
          firebase-service-account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: deployment/extension.zip
          if-no-files-found: error
  publish-extension:
    name: Publish Chrome extension
    needs: deploy
    if: contains(github.event.release.body, '[publish-extension]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
      - name: Upload and publish verified Chrome extension
        env:
          CLIENT_ID: ${{ secrets.WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.WEBSTORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.WEBSTORE_PUBLISHER_ID }}
        run: |
          npx chrome-webstore-upload-cli@latest upload --source extension.zip --extension-id kcpganeflmhffnlofpdmcjklmdpbbmef
          npx chrome-webstore-upload-cli@latest publish --extension-id kcpganeflmhffnlofpdmcjklmdpbbmef
